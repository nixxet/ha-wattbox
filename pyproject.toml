[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattbox-local"
version = "0.1.0.dev0"
description = "Async Python client for SnapAV WattBox PDUs over SSH/Telnet (?Cmd/!Cmd protocol)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Robert Nall" }]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
dependencies = [
  "asyncssh>=2.18",
  "telnetlib3>=2.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4",
]

[project.urls]
Homepage = "https://github.com/nixxet/ha-wattbox"
Repository = "https://github.com/nixxet/ha-wattbox"
Issues = "https://github.com/nixxet/ha-wattbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wattbox_local"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "ASYNC",            # async pitfalls
  "TID",              # tidy imports
  "PTH",              # use pathlib
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# tests mirror the production Transport signature
"tests/**" = ["B011", "ASYNC109"]
# Public transport API deliberately exposes a `timeout=` parameter (mirrors httpx/aiohttp/asyncssh).
"src/wattbox_local/transport.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["telnetlib3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=wattbox_local",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
markers = [
  "live: tests that hit real WattBox hardware (requires WATTBOX_LIVE=1)",
]

[tool.coverage.run]
source = ["src/wattbox_local"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
