# Example Lovelace dashboard for ha-wattbox.
#
# Professional, full-width layout using the modern `sections` view. Each
# section is a self-contained, titled card group with breathing room between
# them — no stacked-box wall. The WB-800 sprawls across the full width;
# WB-250s sit side-by-side underneath.
#
# Drop into a new dashboard via:
#   Settings -> Dashboards -> + Add Dashboard -> New from scratch
#   -> open it -> top-right Edit -> 3-dot menu -> Raw configuration editor
#
# Entity-id assumptions (HA auto-generates from device hostname + outlet
# name; adjust if yours differ — HA's entity picker shows the exact ids):
#
#   WB-800 hostname "WattBox":
#     switch.wattbox_<outlet_name>
#     sensor.wattbox_power / _current / _voltage
#     sensor.wattbox_<outlet_name>_power
#     sensor.wattbox_ups_battery / _load / _runtime
#     binary_sensor.wattbox_api_locked_out
#     binary_sensor.wattbox_mains_power / _audible_alarm_armed / _ups_connected
#
#   WB-250 hostnames "WattBoxGarage" and (renamed) "Spare".

title: WattBoxes
views:

  - title: Racks
    path: racks
    icon: mdi:power-plug
    type: sections
    max_columns: 4
    dense_section_placement: false
    sections:

      # ============================================================
      # SECTION 1 — Fleet status (full width across the top)
      # ============================================================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Fleet status
            heading_style: title
            icon: mdi:server-network

          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: binary_sensor.wattbox_api_locked_out
                name: WB-800 API
                icon: mdi:lock-alert
                color: red
              - type: tile
                entity: binary_sensor.wattboxgarage_api_locked_out
                name: Garage API
                icon: mdi:lock-alert
                color: red
              # Rename the .152 device in HA -> Devices to "Spare" to avoid
              # colliding with the 800's "wattbox" entity prefix.
              - type: tile
                entity: binary_sensor.spare_api_locked_out
                name: Spare API
                icon: mdi:lock-alert
                color: red
              - type: tile
                entity: binary_sensor.wattbox_audible_alarm_armed
                name: UPS alarm armed
                icon: mdi:bell-ring
                color: amber

      # ============================================================
      # SECTION 2 — WB-800 power & UPS (full width)
      # ============================================================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: WB-800 · power & UPS
            heading_style: title
            icon: mdi:flash

          - type: grid
            columns: 3
            square: false
            cards:
              - type: gauge
                entity: sensor.wattbox_ups_battery
                name: UPS battery
                min: 0
                max: 100
                unit: "%"
                needle: true
                severity:
                  red: 0
                  yellow: 30
                  green: 60
              - type: gauge
                entity: sensor.wattbox_ups_load
                name: UPS load
                min: 0
                max: 100
                unit: "%"
                needle: true
                severity:
                  green: 0
                  yellow: 60
                  red: 85
              - type: gauge
                entity: sensor.wattbox_power
                name: Total draw
                min: 0
                max: 1500
                unit: W
                needle: true
                severity:
                  green: 0
                  yellow: 800
                  red: 1200

          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: sensor.wattbox_ups_runtime
                name: Runtime
                icon: mdi:timer-sand
                color: cyan
              - type: tile
                entity: binary_sensor.wattbox_mains_power
                name: Mains
                icon: mdi:power-plug
                color: green
              - type: tile
                entity: sensor.wattbox_voltage
                name: Voltage
                icon: mdi:sine-wave
              - type: tile
                entity: sensor.wattbox_current
                name: Current
                icon: mdi:current-ac
                color: amber

      # ============================================================
      # SECTION 3 — WB-800 outlets (full width, one wide grid)
      # ============================================================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: WB-800 · outlets
            heading_style: title
            icon: mdi:power-socket-us

          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: switch.wattbox_dish_hopper
                name: Dish Hopper
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_ea3
                name: EA3
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_denon_rcv
                name: Denon Rcv
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_cheap_led_strip
                name: LED Strip
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_outlet_5
                name: Outlet 5
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_nvidia_shield
                name: Nvidia Shield
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_wtc_ups
                name: WTC UPS
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_dream_machine
                name: Dream Machine
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_vivint_camera
                name: Vivint Camera
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_hikvision_nvr
                name: Hikvision NVR
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_ps5
                name: PS5
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_unifi_24_switch
                name: Unifi 24 Switch
                features:
                  - type: toggle

      # ============================================================
      # SECTION 4 — WB-800 per-outlet draw (full width)
      # ============================================================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: WB-800 · per-outlet draw
            heading_style: title
            icon: mdi:chart-bar

          - type: grid
            columns: 6
            square: false
            cards:
              - type: tile
                entity: sensor.wattbox_dish_hopper_power
                name: Dish Hopper
                vertical: true
              - type: tile
                entity: sensor.wattbox_ea3_power
                name: EA3
                vertical: true
              - type: tile
                entity: sensor.wattbox_denon_rcv_power
                name: Denon Rcv
                vertical: true
              - type: tile
                entity: sensor.wattbox_cheap_led_strip_power
                name: LED Strip
                vertical: true
              - type: tile
                entity: sensor.wattbox_outlet_5_power
                name: Outlet 5
                vertical: true
              - type: tile
                entity: sensor.wattbox_nvidia_shield_power
                name: Nvidia Shield
                vertical: true
              - type: tile
                entity: sensor.wattbox_wtc_ups_power
                name: WTC UPS
                vertical: true
              - type: tile
                entity: sensor.wattbox_dream_machine_power
                name: Dream Machine
                vertical: true
              - type: tile
                entity: sensor.wattbox_vivint_camera_power
                name: Vivint Camera
                vertical: true
              - type: tile
                entity: sensor.wattbox_hikvision_nvr_power
                name: Hikvision NVR
                vertical: true
              - type: tile
                entity: sensor.wattbox_ps5_power
                name: PS5
                vertical: true
              - type: tile
                entity: sensor.wattbox_unifi_24_switch_power
                name: Unifi 24 Switch
                vertical: true

      # ============================================================
      # SECTION 5 — 24h history (full width)
      # ============================================================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: WB-800 · last 24 hours
            heading_style: title
            icon: mdi:chart-line

          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.wattbox_power
                name: Total
              - entity: sensor.wattbox_denon_rcv_power
                name: Denon
              - entity: sensor.wattbox_nvidia_shield_power
                name: Shield
              - entity: sensor.wattbox_unifi_24_switch_power
                name: Unifi 24
              - entity: sensor.wattbox_hikvision_nvr_power
                name: NVR
              - entity: sensor.wattbox_ps5_power
                name: PS5

      # ============================================================
      # SECTION 6 — Garage WB-250 (half width, left)
      # ============================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Garage · WB-250-IPW-2
            heading_style: title
            icon: mdi:garage

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.wattboxgarage_outlet_1
                name: Outlet 1
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattboxgarage_outlet_2
                name: Outlet 2
                features:
                  - type: toggle

      # ============================================================
      # SECTION 7 — Spare WB-250 (half width, right)
      # ============================================================
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Spare · WB-250-IPW-2
            heading_style: title
            icon: mdi:server

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.spare_not_used
                name: Not Used
                features:
                  - type: toggle
              - type: tile
                entity: switch.spare_sony_tv
                name: Sony TV
                features:
                  - type: toggle

      # ============================================================
      # SECTION 8 — Quick actions (full width, bottom)
      # ============================================================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Quick actions
            heading_style: title
            icon: mdi:restart

          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: button.wattbox_reset_ps5
                name: Reset PS5
                icon: mdi:restart
                tap_action:
                  action: toggle
              - type: tile
                entity: button.wattbox_reset_dream_machine
                name: Reset Dream Machine
                icon: mdi:restart
                tap_action:
                  action: toggle
              - type: tile
                entity: button.wattbox_reset_hikvision_nvr
                name: Reset NVR
                icon: mdi:restart
                tap_action:
                  action: toggle
              - type: tile
                entity: button.wattbox_reset_all_outlets
                name: Reset ALL outlets
                icon: mdi:restart-alert
                color: red
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.wattbox_reset_all_outlets
                  confirmation:
                    text: This will power-cycle every outlet on the WB-800. Continue?
