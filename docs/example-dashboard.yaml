# Example Lovelace dashboard for ha-wattbox.
#
# Modern `sections` view, 4-column grid with dense placement. The Rack WattBox
# (WB-800) takes the full-width strips; Fleet status (1) + Quick actions (3)
# share the top row; Garage TV (1) + Family Room TV (2) share the bottom row.
#
# Drop into a new dashboard via:
#   Settings -> Dashboards -> + Add Dashboard -> New from scratch
#   -> open it -> top-right Edit -> 3-dot menu -> Raw configuration editor
#
# ----------------------------------------------------------------------------
# Layout notes
# ----------------------------------------------------------------------------
# * `max_columns: 4` + `dense_section_placement: true` lets sections re-flow
#   into available row space instead of leaving gutters.
# * The Rack outlets / per-outlet draw / history grids carry an inner
#   `grid_options: columns: 24, rows: auto`. That forces the inner grid to
#   span the section's full width regardless of viewport — without it the
#   inner grid will collapse to a narrower default and look ragged.
# * Asymmetric col_spans (1+3, 1+2) give the layout visual rhythm rather than
#   uniform halves; pair the smaller half with the denser content.
#
# ----------------------------------------------------------------------------
# Entity-id reality check
# ----------------------------------------------------------------------------
# Entity IDs in HA are STICKY to the device's *original* hostname at
# registration. Renaming a device in Settings -> Devices changes only the
# friendly name; entity_ids do not move. On this rack three devices all
# registered as variants of "WattBox":
#
#   Rack WattBox          (WB-800, 10.10.10.156)  -> entity prefix: wattbox_*
#   Family Room WattBox   (WB-250, 10.10.10.152)  -> *collided* into wattbox_*
#                                                    Its API-lockout / reset-all
#                                                    got "_2" suffixes; its two
#                                                    switches kept their outlet
#                                                    names (wattbox_not_used,
#                                                    wattbox_sony_tv).
#   Garage TV WattBox     (WB-250, 10.10.10.150)  -> entity prefix: wattboxgarage_*
#
# To clean this up permanently: open each entity in Settings -> Devices &
# Services -> [device] -> Entities -> click entity -> gear icon -> set a new
# entity_id (e.g. `switch.rack_dish_hopper`). Then update this YAML to match.
#
# ----------------------------------------------------------------------------
# Tile label vs outlet name
# ----------------------------------------------------------------------------
# Each tile below carries a hardcoded `name:` — that label OVERRIDES whatever
# the WattBox reports as the outlet name. If you call the
# `wattbox.set_outlet_name` service to rename an outlet on the device, this
# dashboard will still display the old hardcoded label until you either edit
# the `name:` line here or delete it (delete = fall back to the entity's
# friendly name, which will track future renames automatically).

title: WattBoxes
views:
  - title: Racks
    path: racks
    icon: mdi:power-plug
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Fleet status
            heading_style: title
            icon: mdi:server-network
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: binary_sensor.wattbox_api_locked_out
                name: Rack API
                icon: mdi:lock-alert
                color: red
              - type: tile
                entity: binary_sensor.wattboxgarage_api_locked_out
                name: Garage TV API
                icon: mdi:lock-alert
                color: red
              - type: tile
                entity: binary_sensor.wattbox_api_locked_out_2
                name: Family Room TV API
                icon: mdi:lock-alert
                color: red
              - type: tile
                entity: binary_sensor.wattbox_ups_alarm
                name: UPS alarm armed
                icon: mdi:bell-ring
                color: amber
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Quick actions
            heading_style: title
            icon: mdi:restart
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: button.wattbox_reset_ps5
                name: Reset PS5
                icon: mdi:restart
                tap_action:
                  action: toggle
              - type: tile
                entity: button.wattbox_reset_dream_machine
                name: Reset Dream Machine
                icon: mdi:restart
                tap_action:
                  action: toggle
              - type: tile
                entity: button.wattbox_reset_hikvision_nvr
                name: Reset NVR
                icon: mdi:restart
                tap_action:
                  action: toggle
              - type: tile
                entity: button.wattbox_reset_all_outlets
                name: Reset ALL outlets
                icon: mdi:restart-alert
                color: red
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.wattbox_reset_all_outlets
                  confirmation:
                    text: >-
                      This will power-cycle every outlet on the Rack WattBox.
                      Continue?
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Rack WattBox · power & UPS
            heading_style: title
            icon: mdi:flash
          - type: grid
            columns: 3
            square: false
            cards:
              - type: gauge
                entity: sensor.wattbox_ups_battery
                name: UPS battery
                min: 0
                max: 100
                unit: '%'
                needle: true
                severity:
                  red: 0
                  yellow: 30
                  green: 60
              - type: gauge
                entity: sensor.wattbox_ups_load
                name: UPS load
                min: 0
                max: 100
                unit: '%'
                needle: true
                severity:
                  green: 0
                  yellow: 60
                  red: 85
              - type: gauge
                entity: sensor.wattbox_power
                name: Power
                min: 0
                max: 1500
                unit: W
                needle: true
                severity:
                  green: 0
                  yellow: 800
                  red: 1200
          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: sensor.wattbox_ups_runtime
                name: Runtime
                icon: mdi:timer-sand
                color: cyan
              - type: tile
                entity: binary_sensor.wattbox_mains_power
                name: Mains
                icon: mdi:power-plug
                color: green
              - type: tile
                entity: sensor.wattbox_voltage
                name: Voltage
                icon: mdi:sine-wave
              - type: tile
                entity: sensor.wattbox_current
                name: Current
                icon: mdi:current-ac
                color: amber
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Rack WattBox · outlets
            heading_style: title
            icon: mdi:power-socket-us
          - type: grid
            columns: 6
            square: false
            cards:
              - type: tile
                entity: switch.wattbox_dish_hopper
                name: Dish Hopper
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_ea3
                name: EA3
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_denon_rcv
                name: Denon Rcv
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_cheap_led_strip
                name: LED Strip
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_outlet_5
                name: Outlet 5
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_nvidia_shield
                name: Nvidia Shield
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_wtc_ups
                name: WTC UPS
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_dream_machine
                name: Dream Machine
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_vivint_camera
                name: Vivint Camera
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_hikvision_nvr
                name: Hikvision NVR
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_ps5
                name: PS5
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_unifi_24_switch
                name: Unifi 24 Switch
                features:
                  - type: toggle
            grid_options:
              columns: 24
              rows: auto
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Rack WattBox · per-outlet draw
            heading_style: title
            icon: mdi:chart-bar
          - type: grid
            columns: 6
            square: false
            cards:
              - type: tile
                entity: sensor.wattbox_dish_hopper_power
                name: Dish Hopper
                vertical: true
              - type: tile
                entity: sensor.wattbox_ea3_power
                name: EA3
                vertical: true
              - type: tile
                entity: sensor.wattbox_denon_rcv_power
                name: Denon Rcv
                vertical: true
              - type: tile
                entity: sensor.wattbox_cheap_led_strip_power
                name: LED Strip
                vertical: true
              - type: tile
                entity: sensor.wattbox_outlet_5_power
                name: Outlet 5
                vertical: true
              - type: tile
                entity: sensor.wattbox_nvidia_shield_power
                name: Nvidia Shield
                vertical: true
              - type: tile
                entity: sensor.wattbox_wtc_ups_power
                name: WTC UPS
                vertical: true
              - type: tile
                entity: sensor.wattbox_dream_machine_power
                name: Dream Machine
                vertical: true
              - type: tile
                entity: sensor.wattbox_vivint_camera_power
                name: Vivint Camera
                vertical: true
              - type: tile
                entity: sensor.wattbox_hikvision_nvr_power
                name: Hikvision NVR
                vertical: true
              - type: tile
                entity: sensor.wattbox_ps5_power
                name: PS5
                vertical: true
              - type: tile
                entity: sensor.wattbox_unifi_24_switch_power
                name: Unifi 24 Switch
                vertical: true
            grid_options:
              columns: 24
              rows: auto
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Rack WattBox · last 24 hours
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.wattbox_power
                name: Total
              - entity: sensor.wattbox_denon_rcv_power
                name: Denon
              - entity: sensor.wattbox_nvidia_shield_power
                name: Shield
              - entity: sensor.wattbox_unifi_24_switch_power
                name: Unifi 24
              - entity: sensor.wattbox_hikvision_nvr_power
                name: NVR
              - entity: sensor.wattbox_ps5_power
                name: PS5
            grid_options:
              columns: 24
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Garage TV WattBox · WB-250-IPW-2
            heading_style: title
            icon: mdi:garage
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.wattboxgarage_outlet_1
                name: Outlet 1
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattboxgarage_outlet_2
                name: Outlet 2
                features:
                  - type: toggle
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Family Room TV WattBox · WB-250-IPW-2
            heading_style: title
            icon: mdi:television
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.wattbox_not_used
                name: Not Used
                features:
                  - type: toggle
              - type: tile
                entity: switch.wattbox_sony_tv
                name: Sony TV
                features:
                  - type: toggle
